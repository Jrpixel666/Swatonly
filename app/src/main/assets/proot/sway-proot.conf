# Swatonly: sway runs nested inside the Android launcher's Wayland compositor
# (WLR_BACKENDS=wayland), under proot. Rewritten by the launcher on every
# session start; put your own overrides in other files in this directory.

# there is no X server to bridge to
xwayland disable

# keep the pointer visible: touch input is turned into pointer events
seat * hide_cursor 0

# taps should not move focus just by passing over a window
focus_follows_mouse no
